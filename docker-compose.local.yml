services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ckg
      POSTGRES_PASSWORD: ckg
      POSTGRES_DB: ckg
    ports:
      - "5433:5432"
    volumes:
      - ckg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ckg_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ckg_pg_data:
  ckg_redis_data:
